name: Build native 13.60 installer ELF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_REF: v0.5.2
    steps:
      - name: Check out Relapse
        uses: actions/checkout@v4

      - name: Verify payload UI behavior
        run: node native/test-payload-ui.cjs

      - name: Fetch upstream native installer sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${UPSTREAM_REF}" \
            https://github.com/itsPLK/ps5-webkit-autoloader.git .native-upstream
          git -C .native-upstream submodule update --init --recursive

      - name: Brand the upstream automatic payload interface
        shell: bash
        run: |
          set -euo pipefail
          # Keep the complete upstream frontend and unified autoloader.
          # Add the outer menu; preserve upstream retry and failure handling.
          cp assets/icon.png .native-upstream/assets/relapse-icon.png
          python3 native/embed-icon.py .native-upstream
          python3 native/brand-upstream.py .native-upstream
          python3 native/configure-flow.py .native-upstream

      - name: Build the official PS5 SDK container
        run: docker build -t ps5-relapse-autoloader-sdk \
          -f .native-upstream/Dockerfile.sdk .native-upstream

      - name: Compile the native installer ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/.native-upstream:/src" \
            -w /src \
            ps5-relapse-autoloader-sdk make clean all
          cp .native-upstream/installer.elf ps5-relapse-autoloader-installer.0.3.0.elf
          sha256sum ps5-relapse-autoloader-installer.0.3.0.elf > ps5-relapse-autoloader-installer.0.3.0.elf.sha256

      - name: Verify payload bridge
        run: node native/test-menu-bridge.cjs .native-upstream

      - name: Upload native installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-relapse-autoloader-installer-13.60
          path: |
            ps5-relapse-autoloader-installer.0.3.0.elf
            ps5-relapse-autoloader-installer.0.3.0.elf.sha256
