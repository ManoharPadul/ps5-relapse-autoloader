<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 Relapse AutoLoader</title>
<style>
  :root {
      color-scheme: dark;
      --relapse-black: #000;
      --relapse-panel: #111;
      --relapse-panel-raised: #181818;
      --relapse-line: rgba(255,255,255,.12);
      --relapse-muted: #929292;
      --relapse-white: #f4f4f4;
      --relapse-green: #8df0ad;
  }
  html, body { margin: 0; padding: 0; background: var(--relapse-black); color: var(--relapse-white); }

  #relapse-boot-options {
      box-sizing: border-box;
      margin: 14px auto;
      max-width: 720px;
      padding: 16px 18px 14px;
      border: 1px solid var(--relapse-line);
      border-radius: 18px;
      background: linear-gradient(145deg, var(--relapse-panel-raised), var(--relapse-panel));
      color: var(--relapse-white);
      box-shadow: 0 14px 40px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.04);
      font: 14px/1.4 Arial, sans-serif;
  }
  #relapse-boot-options label {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      cursor: pointer;
  }
  #relapse-boot-options input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
  }
  .relapse-boot-copy { display: grid; gap: 3px; min-width: 0; }
  .relapse-boot-eyebrow {
      color: var(--relapse-green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
  }
  .relapse-boot-title { color: var(--relapse-white); font-size: 17px; font-weight: 700; }
  .relapse-boot-description { color: var(--relapse-muted); font-size: 12px; }
  .relapse-switch {
      flex: 0 0 auto;
      width: 48px;
      height: 28px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: #2a2a2a;
      box-sizing: border-box;
      transition: background .16s ease, border-color .16s ease;
  }
  .relapse-switch::after {
      content: "";
      display: block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #aaa;
      box-shadow: 0 2px 6px rgba(0,0,0,.45);
      transition: transform .16s ease, background .16s ease;
  }
  #relapse-boot-options input:checked + .relapse-boot-copy + .relapse-switch {
      border-color: rgba(141,240,173,.5);
      background: #2b5d3d;
  }
  #relapse-boot-options input:checked + .relapse-boot-copy + .relapse-switch::after {
      transform: translateX(20px);
      background: var(--relapse-green);
  }
  #relapse-boot-options input:focus-visible + .relapse-boot-copy + .relapse-switch {
      outline: 2px solid var(--relapse-green);
      outline-offset: 3px;
  }
  #relapse-boot-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: var(--relapse-muted);
      font-size: 11px;
  }
  #relapse-boot-status::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #777;
  }

  /* The log is shown by default so the console screen is readable (you cannot
     add a query flag when the User Guide redirects straight in). Pass ?log=0 to
     hide it. */
  #console { display: none; }
  body.verbose #console {
      display: block;
      box-sizing: border-box;
      min-height: 100vh;
      padding: 10px 12px;
      color: #dfe3ee;
      font: 12px/1.45 ui-monospace, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
  }
  #console div { padding: 1px 0; }
  .LOG-DEBUG { color: #6f7480; }
  .LOG-INFO { color: #b9c2ff; }
  .LOG-LOG { color: #dfe3ee; }
  .LOG-WARN { color: #ffd27d; }
  .LOG-ERROR { color: #ff6b6b; }
  .LOG-SUCCESS { color: #7dff9e; }

  /* Slopkit-style in-page payload screen. Keeping it in this document is
     important: the exploit primitives and the console-side sender stay alive. */
  body.payload-mode { background: var(--relapse-black); color: #fff; }
  body.payload-mode #console {
      display: block;
      box-sizing: border-box;
      min-height: 100vh;
      padding: 8px 0 0;
      color: #fff;
      font: 12px/1.35 ui-monospace, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
  }
  body.payload-mode #console > div:not(.relapse-payload-screen) { padding: 1px 12px; }
  body.payload-only-mode #console > div:not(.relapse-payload-screen) { display: none; }
  body.payload-only-mode #console { padding: 0; overflow: hidden; }
  body.payload-only-mode #relapse-boot-options { display: block; }
  body.payload-only-mode .relapse-payload-screen {
      min-height: 100vh;
      margin-top: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
  }
  .relapse-payload-screen {
      margin-top: 0;
      padding: 18px 30px 28px;
      background: radial-gradient(circle at 50% -20%, #151515 0, var(--relapse-black) 52%);
      color: #fff;
      font: 16px/1.35 Arial, sans-serif;
      white-space: normal;
      word-break: normal;
  }
  .relapse-payload-header {
      display: block;
      gap: 24px;
      box-sizing: border-box;
      min-height: 104px;
      padding: 4px 2px 18px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      text-align: center;
  }
  .relapse-payload-brand { min-width: 0; text-align: center; }
  .relapse-payload-kicker {
      margin-bottom: 6px;
      color: var(--relapse-green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
  }
  .relapse-payload-header h2 {
      margin: 0;
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.1;
  }
  .relapse-payload-header p { margin: 8px 0 0; color: #949494; font-size: 13px; }
  .relapse-payload-byline { margin-top: 6px; color: #bdbdbd; font-size: 12px; letter-spacing: .04em; }
  .relapse-loader-badge {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 8px;
      width: fit-content;
      margin: 14px auto 0;
      padding: 8px 11px;
      border: 1px solid rgba(141,240,173,.25);
      border-radius: 999px;
      background: rgba(141,240,173,.06);
      color: #b9cdbf;
      font-size: 11px;
      white-space: nowrap;
  }
  .relapse-loader-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--relapse-green);
      box-shadow: 0 0 10px rgba(141,240,173,.7);
  }
  .relapse-payload-header .eyebrow { color: var(--relapse-green); font-size: 11px; }
  .relapse-payload-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      padding: 20px 0 4px;
      box-sizing: border-box;
      align-content: start;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
  }
  .relapse-payload-tile {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      min-width: 0;
      min-height: 92px;
      margin: 0;
      padding: 16px 20px 15px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      background: linear-gradient(135deg, #171717, #101010);
      color: #f4f4f4 !important;
      cursor: pointer;
      text-align: center;
      font: inherit;
      line-height: 1.5;
      outline: 0;
      -webkit-appearance: none;
      appearance: none;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
  }
  .relapse-payload-tile:hover,
  .relapse-payload-tile:focus {
      background: #242424;
      border-color: var(--relapse-green);
      color: #f4f4f4 !important;
  }
  .relapse-payload-tile:focus { box-shadow: 0 0 0 3px rgba(141,240,173,.24); }
  .relapse-payload-tile:active { transform: scale(.99); }
  .relapse-payload-tile::before {
      content: "";
      position: absolute;
      width: 3px;
      height: 34px;
      margin-left: -13px;
      border-radius: 4px;
      background: #555;
  }
  .relapse-payload-tile { position: relative; }
  .relapse-payload-tile:focus::before,
  .relapse-payload-tile:hover::before { background: var(--relapse-green); }
  .relapse-payload-tile.busy { opacity: .5; pointer-events: none; }
  .relapse-payload-tile.sent { border: 2px solid #47c76a; }
  .relapse-payload-tile.failed { border: 2px solid #e74856; }
  .relapse-payload-title {
      display: block;
      margin: 0;
      color: #f4f4f4 !important;
      font-family: Arial, sans-serif;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.2;
  }
  .relapse-payload-description {
      display: block;
      margin: 5px 0 0;
      color: #c8c8c8 !important;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.25;
  }
  .relapse-payload-info {
      display: block;
      margin: 7px 0 0;
      color: #8e8e8e !important;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.2;
  }
  @media (max-width: 760px) {
      .relapse-payload-screen { padding-left: 16px; padding-right: 16px; }
      .relapse-payload-header { align-items: flex-start; flex-direction: column; gap: 12px; }
      .relapse-payload-grid { grid-template-columns: 1fr; }
  }
</style>

<body>

<div id="console"></div>
<section id="relapse-boot-options" aria-label="Relapse boot options">
  <label>
    <input id="autoload-pldmgr" type="checkbox">
    <span class="relapse-boot-copy">
      <span class="relapse-boot-eyebrow">Payload manager</span>
      <span class="relapse-boot-title">Autoload pldmgr</span>
      <span class="relapse-boot-description">Start pldmgr five seconds after a successful jailbreak.</span>
    </span>
    <span class="relapse-switch" aria-hidden="true"></span>
  </label>
  <div id="relapse-boot-status">Offline cache will be prepared before jailbreak.</div>
</section>

<script src="rop.js"></script>
<script src="payloads.js?v=3"></script>
<script src="firmware.js?v=4"></script>
<script src="main.js?v=6"></script>

<script>
// main.js appends the offsets script for the detected firmware as its last act.
// Everything downstream needs those globals, so publish a promise for them.
window.offsetsReady = new Promise(function (resolve, reject) {
    var script = document.querySelector('script[src^="offsets/"]');
    if (!script) return reject(new Error("main.js never injected an offsets script"));
    if (typeof OFFSET_wk_vtable_first_element !== "undefined") return resolve(script.src);
    script.addEventListener("load", function () { resolve(script.src); });
    script.addEventListener("error", function () {
        reject(new Error("offsets script failed to load: " + script.src));
    });
});
</script>

<script src="syscalls.js"></script>

<script>
// Optional overrides, all off by default:
//   ?kexp=<file>     use a different kernel shellcode blob
//   ?elfldr=<file>   use a different ELF loader payload
//   ?log=0           hide the on-screen progress log (shown by default)
(function () {
    var query = new URLSearchParams(location.search);
    window.AIO_CFG = {};
    if (query.get("kexp")) AIO_CFG.kexp = query.get("kexp");
    if (query.get("elfldr")) AIO_CFG.elfldr = query.get("elfldr");
    if (query.get("force") === "1") AIO_CFG.force = true;
    if (query.get("log") !== "0") document.body.classList.add("verbose");
})();
</script>

<script type="module">
// core.js's ?v= here and in mem.js MUST be identical. In ES modules the URL is
// the module identity, so a mismatch loads two separate core.js instances: this
// file would establish the primitive on one while mem.js promotes the other.
import { establishPrimitive, fakeCellReleased, CORE_INSTANCE } from "./core.js?v=132";
import { installWindowP, pairStatus, memCoreInstance } from "./mem.js?v=131";

if (CORE_INSTANCE !== memCoreInstance)
    throw new Error("core.js module skew: index.html and mem.js imported different ?v= URLs");

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

var __bseq=0;
function __bcn(m){
    if (!window.__telemetryEnabled) return;
    try{new Image().src="log/LT-s"+(++__bseq)+"-"+encodeURIComponent(String(m)).slice(0,400)+"?t="+Date.now();}catch(e){}
}
var __logQueue=[];
var __logFlushScheduled=false;
function __flushLogs(){
    __logFlushScheduled=false;
    var view=document.getElementById("console");
    if (!view || !__logQueue.length) return;
    var frag=document.createDocumentFragment();
    while (__logQueue.length) {
        var item=__logQueue.shift();
        var line=document.createElement("div");
        line.className=item.level || "LOG-LOG";
        line.textContent=item.message;
        frag.appendChild(line);
    }
    view.appendChild(frag);
    var screen=document.getElementById("relapse-payload-screen");
    while (view.children.length - (screen ? 1 : 0) > 600) {
        var first=view.firstElementChild;
        if (!first || first === screen) break;
        first.remove();
    }
    if (document.body.classList.contains("verbose")) view.scrollTop=view.scrollHeight;
}
function print(message, level) {
    __bcn(message);
    __logQueue.push({message:String(message), level:level || "LOG-LOG"});
    if (!__logFlushScheduled) {
        __logFlushScheduled=true;
        requestAnimationFrame(__flushLogs);
    }
}

function reportFailure(error) {
    const message = String((error && error.message) || error)
        + ((error && error.stack) ? " @" + error.stack : "");
    print("FAILED: " + message, "LOG-ERROR");
    try { window.__rep("PAGE-FAIL", message.slice(0, 400)); } catch (e) { /* best effort */ }
}

const AUTOLOAD_PLDMGR_KEY = "relapse.autoloadPldmgr";
const autoloadPldmgrToggle = document.getElementById("autoload-pldmgr");
const bootStatus = document.getElementById("relapse-boot-status");

function setBootStatus(message, level) {
    if (bootStatus) bootStatus.textContent = message;
    if (level) print(message, level);
}

function loadAutoloadPldmgrSetting() {
    try { return localStorage.getItem(AUTOLOAD_PLDMGR_KEY) === "1"; }
    catch (e) { return false; }
}

function saveAutoloadPldmgrSetting(enabled) {
    try { localStorage.setItem(AUTOLOAD_PLDMGR_KEY, enabled ? "1" : "0"); }
    catch (e) { /* private browsing may disable storage */ }
}

if (autoloadPldmgrToggle) {
    autoloadPldmgrToggle.checked = loadAutoloadPldmgrSetting();
    autoloadPldmgrToggle.addEventListener("change", () => {
        saveAutoloadPldmgrSetting(autoloadPldmgrToggle.checked);
        setBootStatus(autoloadPldmgrToggle.checked
            ? "pldmgr autoload enabled for the next successful jailbreak."
            : "pldmgr autoload disabled; the normal payload menu will open.");
    });
}

async function autoloadPldmgrIfEnabled() {
    if (!autoloadPldmgrToggle || !autoloadPldmgrToggle.checked) return false;
    if (typeof window.__sendPayload !== "function") return false;

    autoloadPldmgrToggle.disabled = true;
    for (let seconds = 5; seconds > 0; seconds--) {
        setBootStatus("pldmgr autoload enabled - sending in " + seconds + " second" + (seconds === 1 ? "" : "s") + "...", "LOG-INFO");
        await sleep(1000);
    }

    try {
        setBootStatus("Loading pldmgr_v0.5.2.elf to port 9021...", "LOG-INFO");
        const sent = await window.__sendPayload("pldmgr_v0.5.2.elf");
        setBootStatus("pldmgr v0.5.2 sent (" + sent + " bytes); opening port 8084...", "LOG-SUCCESS");
        // Give pldmgr a moment to bind its HTTP socket before navigating away.
        await sleep(500);
        const ip = String(window.__ps5Ip || "");
        if (/^[0-9.]+$/.test(ip)) {
            location.href = "http://" + ip + ":8084/";
            return true;
        }
        setBootStatus("pldmgr sent, but the PS5 network address was unavailable; opening the normal menu.", "LOG-WARN");
    } catch (error) {
        setBootStatus("pldmgr autoload failed; opening the normal menu.", "LOG-ERROR");
        print("pldmgr autoload: " + String((error && error.message) || error), "LOG-ERROR");
    }
    autoloadPldmgrToggle.disabled = false;
    return false;
}

async function ensureOfflineCache() {
    // The native installer has already completed the legacy AppCache download
    // before it creates the homescreen shortcut.  PS5 WebKit does not need a
    // second cache layer here, and some builds do not expose Service Workers.
    // Starting the exploit directly also keeps the heap layout identical to
    // the cached launch path.
    if (location.hostname === "127.0.0.1" && location.port === "18181") {
        setBootStatus("Native AppCache ready - starting jailbreak.", "LOG-SUCCESS");
        return;
    }

    if (!("serviceWorker" in navigator) || !("MessageChannel" in window)) {
        setBootStatus("Service Worker unavailable - starting with the current bundle.", "LOG-WARN");
        return;
    }

    setBootStatus("Preparing offline cache before jailbreak...", "LOG-INFO");
    let registration = await navigator.serviceWorker.register("./sw.js?v=19", { scope: "./" });
    try { await registration.update(); } catch (e) { /* current worker may already be newest */ }

    let worker = null;
    for (let attempt = 0; attempt < 40; attempt++) {
        registration = await navigator.serviceWorker.ready;
        worker = registration.active;
        if (worker && worker.state === "activated" && worker.scriptURL.indexOf("sw.js?v=19") !== -1) break;
        await sleep(250);
    }
    if (!worker || worker.state !== "activated" || worker.scriptURL.indexOf("sw.js?v=19") === -1) {
        throw new Error("offline cache worker did not activate");
    }

    return new Promise((resolve, reject) => {
        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => {
            const data = event.data || {};
            if (data.type === "offline-progress") {
                setBootStatus("Caching offline bundle " + data.done + "/" + data.total + "...", "LOG-DEBUG");
                print("offline cache " + data.done + "/" + data.total + " " + data.asset, "LOG-DEBUG");
            } else if (data.type === "offline-ready") {
                setBootStatus("Offline cache ready - starting jailbreak.", "LOG-SUCCESS");
                resolve();
            } else if (data.type === "offline-error") {
                reject(new Error("offline cache failed: " + data.error));
            }
        };
        channel.port1.start();
        worker.postMessage({ type: "prepare-offline" }, [channel.port2]);
    });
}

// main.js logs progress through window.jb when it is present.
window.jb = { mark: (tag, detail) => print(detail ? tag + " " + detail : tag, "LOG-INFO") };

// main.js carries a payload-sending UI this page does not use, but its entry
// point is called on the path we take, so it has to exist.
window.populatePayloadsPage = () => {};

window.addEventListener("error", (e) => print("error: " + (e && e.message), "LOG-ERROR"));
window.addEventListener("unhandledrejection", (e) =>
    print("rejected: " + String((e && e.reason && e.reason.message) || (e && e.reason)), "LOG-ERROR"));

/** Run the WebKit bug until it yields a working userland read/write primitive. */
async function establishUserlandPrimitive() {
    if (globalThis.p && typeof globalThis.p.read8 === "function") {
        print("reusing the existing primitive", "LOG-INFO");
        return globalThis.p;
    }

    print("running the WebKit bug (placement retries itself)", "LOG-INFO");
    try { history.replaceState(null, ""); } catch (e) { /* not fatal */ }
    if (typeof globalThis.gc === "function") { try { globalThis.gc(); } catch (e) { /* ditto */ } }
    await sleep(750);

    const carrier = await establishPrimitive({
        maxAttempts: 8,
        onEvent(tag, detail, attempt) {
            print((typeof attempt === "number" ? "[" + attempt + "] " : "") + tag
                + (detail ? " " + detail : ""), "LOG-DEBUG");
        },
        beforeCriticalLoad() {
            try { document.getElementById("console").offsetWidth; } catch (e) { /* layout poke */ }
        },
    });

    installWindowP(carrier, {
        onEvent(tag, detail) {
            print(tag + " " + detail, "LOG-DEBUG");
            try { window.__rep(tag, String(detail ?? "").slice(0, 400)); } catch (e) { /* ditto */ }
        },
    });
    if (!pairStatus.promoted)
        throw new Error("the primitive pair was not promoted: " + pairStatus.error);

    if (typeof globalThis.gc === "function") { try { globalThis.gc(); } catch (e) { /* ditto */ } }
    await sleep(1000);

    const p = globalThis.p;
    if (!p || typeof p.read8 !== "function") throw new Error("window.p was never published");
    print("primitive up (fakeCellReleased=" + fakeCellReleased() + ")", "LOG-INFO");
    return p;
}

async function run() {
    const rejection = window.firmware.rejection();
    if (rejection) throw new Error(rejection);

    await ensureOfflineCache();
    await offsetsReady;
    print("firmware " + window.fw_str, "LOG-INFO");

    const p = await establishUserlandPrimitive();

    // Imported here rather than at the top of the file on purpose: a module's
    // source text is on the heap before the groom runs, and the placement the
    // WebKit bug depends on is sensitive to what is sitting there.
    await import("./exploit.js");

    // main() prepares the ROP worker and then drives the kernel chain.
    await main(p);

    // Draw the payload menu HERE rather than handing off to elf.html.
    //
    // This document still owns the exploit primitives, so main.js could expose
    // window.__sendPayload, which has the CONSOLE open 127.0.0.1:9021 through its own
    // syscalls. No server does anything, so the menu works from any static host -
    // GitHub Pages included. elf.html cannot do that: it deliberately carries no
    // exploit code, so it has to ask the host to open the socket, which needs a server
    // that runs code AND can route back to the console.
    //
    // Navigating away would destroy the primitives with the document, so we stay put.
    if (!window.__elfldrUp || typeof window.__sendPayload !== "function") return;
    if (await autoloadPldmgrIfEnabled()) return;
    buildPayloadMenu();
}

/** Plain DOM cards keep text stable on PS5 WebKit and remain controller-focusable. */
function buildPayloadMenu() {
    if (document.getElementById("relapse-payload-screen")) return;
    const tiles = (window.PAYLOAD_TILES || []).slice();
    const fallbackTiles = [
        { title: "PLK Manager v0.5.2 (13.60)", description: "Rebuilt with latest SDK. Open PS5-IP:8084.", name: "pldmgr_v0.5.2.elf", key: "pldmgr-v052", art: false },
        { title: "nanodns", description: "nanodns payload.", name: "nanodns.elf", key: "nanodns", art: false },
        { title: "shadowmountplus", description: "shadowmountplus payload.", name: "shadowmountplus.elf", key: "shadowmountplus", art: false },
        { title: "Game Compressor 1.0.4 · 13.60", description: "Relapse PS5 SDK build. Opens port 5910.", name: "game-compressor.elf", key: "game-compressor", art: false }
    ];
    for (const fallback of fallbackTiles) {
        if (!tiles.some((tile) => tile.name === fallback.name)) tiles.push(fallback);
    }
    if (!tiles.length) return print("no payload list (payloads.js missing)", "LOG-ERROR");

    document.body.classList.add("payload-mode", "payload-only-mode");
    const screen = document.createElement("section");
    screen.id = "relapse-payload-screen";
    screen.className = "relapse-payload-screen";
    const header = document.createElement("div");
    header.className = "relapse-payload-header";
    header.innerHTML = '<div class="relapse-payload-brand">'
        + '<div class="relapse-payload-kicker">PS5 RELAPSE / PAYLOAD CENTER</div>'
        + '<h2>Payloads</h2>'
        + '<div class="relapse-payload-byline">By Manohar Padul</div>'
        + '<p>Select a payload to send it to the local ELF loader.</p>'
        + '</div>'
        + '<div class="relapse-loader-badge">'
        + '<span class="relapse-loader-dot"></span>'
        + '<span class="eyebrow" id="relapse-payload-status">Loader online · port 9021</span>'
        + '</div>';
    const wrap = document.createElement("div");
    wrap.className = "relapse-payload-grid";
    screen.appendChild(header);
    screen.appendChild(wrap);

    for (const t of tiles) {
        const a = document.createElement("div");
        a.setAttribute("role", "button");
        a.setAttribute("tabindex", "0");
        a.setAttribute("aria-label", t.title);
        a.className = "relapse-payload-tile";
        const title = document.createElement("span");
        title.className = "relapse-payload-title";
        title.textContent = t.title;
        const description = document.createElement("span");
        description.className = "relapse-payload-description";
        description.textContent = t.description;
        const info = document.createElement("span");
        info.className = "relapse-payload-info";
        info.textContent = t.name + " · port 9021";
        a.appendChild(title);
        a.appendChild(description);
        a.appendChild(info);
        a.addEventListener("click", async (e) => {
            e.preventDefault();
            a.classList.remove("sent", "failed");
            a.classList.add("busy");
            info.textContent = "Sending ELF to port 9021...";
            document.getElementById("relapse-payload-status").textContent = "Sending " + t.title + "...";
            print(t.title + ": sending ...", "LOG-INFO");
            try {
                const n = await window.__sendPayload(t.name);
                a.classList.remove("busy");
                a.classList.add("sent");
                info.textContent = "Sent " + n + " bytes · port 9021";
                document.getElementById("relapse-payload-status").textContent =
                    t.key.indexOf("pldmgr") === 0 || t.key === "plk"
                        ? "PLK Manager sent · open PS5-IP:8084"
                        : t.title + " sent to port 9021";
                print(t.title + ": sent " + n + " bytes to 127.0.0.1:9021", "LOG-SUCCESS");
                if (t.key === "game-compressor") {
                    const ip = String(window.__ps5Ip || "127.0.0.1");
                    if (/^[0-9.]+$/.test(ip)) {
                        document.getElementById("relapse-payload-status").textContent =
                            "Game Compressor sent · opening local port 5910";
                        await sleep(1000);
                        location.href = "http://" + ip + ":5910/";
                    }
                }
            } catch (err) {
                a.classList.remove("busy");
                a.classList.add("failed");
                const message = String((err && err.message) || err);
                info.textContent = "Failed: " + message;
                document.getElementById("relapse-payload-status").textContent = t.title + " failed";
                print(t.title + ": " + message, "LOG-ERROR");
            }
        });
        a.addEventListener("keydown", (e) => {
            if (e.key !== "Enter" && e.key !== " ") return;
            e.preventDefault();
            a.click();
        });
        wrap.appendChild(a);
    }
    document.getElementById("console").appendChild(screen);
    try { wrap.firstChild.focus(); } catch (e) { /* not fatal */ }
    print("elfldr is up - pick a payload", "LOG-SUCCESS");
}

run().catch(reportFailure);
</script>

</body>
</html>
